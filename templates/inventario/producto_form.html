<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Producto - MiPOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:18px 40px; color:white;
    display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 20px rgba(0,0,0,.1);
    flex-wrap:wrap; gap:15px; }
.navbar-left { display:flex; align-items:center; gap:20px; }
.logo { font-size:1.4em; font-weight:800; }
.nav-links { display:flex; gap:15px; }
.nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:.9em; }
.nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.2); }
.user-info { display:flex; align-items:center; gap:15px; font-size:.95em; }
.user-role { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:.85em; font-weight:700; }
.logout-btn { background:rgba(255,255,255,.2); color:white; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; }

.container { max-width:900px; margin:0 auto; padding:30px 40px 60px; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.page-header h1 { color:#2d3748; font-size:1.8em; }
.btn { padding:12px 24px; border:none; border-radius:10px; font-weight:700; cursor:pointer;
    text-decoration:none; font-size:.95em; transition:all .2s; display:inline-flex; align-items:center; gap:8px; }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(102,126,234,.4); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-secondary { background:#e2e8f0; color:#4a5568; }
.btn-secondary:hover { background:#cbd5e0; }

.form-card { background:white; border-radius:15px; padding:35px; box-shadow:0 2px 15px rgba(0,0,0,.05); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.form-group { display:flex; flex-direction:column; gap:8px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-weight:700; color:#2d3748; font-size:.9em; }
.form-group label .req { color:#f56565; }
.form-group input, .form-group textarea, .form-group select {
    padding:12px 16px; border:2px solid #e2e8f0; border-radius:10px;
    font-size:1em; font-family:inherit; outline:none; transition:border-color .2s;
    background:white;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:#667eea; }
.form-group textarea { resize:vertical; min-height:80px; }

.checkbox-group { flex-direction:row; align-items:center; gap:12px; }
.checkbox-group input[type="checkbox"] { width:20px; height:20px; cursor:pointer; }

.image-upload { display:flex; flex-direction:column; gap:12px; }
.image-preview { max-width:180px; max-height:180px; border-radius:12px; border:2px dashed #e2e8f0;
    object-fit:cover; display:block; }
.image-preview.has-image { border-style:solid; }
.image-placeholder { width:180px; height:180px; border:2px dashed #e2e8f0; border-radius:12px;
    display:flex; align-items:center; justify-content:center; color:#a0aec0; font-size:2.5em; }
.file-input { padding:10px; border:2px dashed #e2e8f0; border-radius:10px; cursor:pointer; }

.form-actions { display:flex; gap:12px; margin-top:30px; justify-content:flex-end; }

.toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:10px;
    color:white; font-weight:600; z-index:9999; box-shadow:0 5px 20px rgba(0,0,0,.2); }
.toast-success { background:#48bb78; }
.toast-error { background:#f56565; }

@media (max-width:768px) {
    .navbar { padding:15px 20px; }
    .container { padding:20px; }
    .form-grid { grid-template-columns:1fr; }
    .form-card { padding:20px; }
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <div class="logo">🛒 MiPOS</div>
        <div class="nav-links">
            <a href="/panel">🏠 Inicio</a>
            <a href="/inventario" class="active">📦 Productos</a>
            <a href="/inventario/entradas">📥 Entradas</a>
            <a href="/inventario/stock">📊 Stock</a>
            <a href="/transferencias">🔄 Transferencias</a>
        </div>
    </div>
    <div class="user-info">
        <span>👤 <span id="userName">...</span></span>
        <span class="user-role" id="userRole">—</span>
        <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 id="pageTitle">Nuevo Producto</h1>
        <a href="/inventario" class="btn btn-secondary">← Volver</a>
    </div>

    <form id="form" class="form-card">
        <div class="form-grid">
            <div class="form-group">
                <label>SKU <span class="req">*</span></label>
                <input name="sku" required maxlength="50">
            </div>
            <div class="form-group">
                <label>Nombre <span class="req">*</span></label>
                <input name="name" required maxlength="150">
            </div>
            <div class="form-group full">
                <label>Descripción</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Precio venta <span class="req">*</span></label>
                <input name="price" type="number" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Costo</label>
                <input name="cost" type="number" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label>Stock mínimo</label>
                <input name="min_stock" type="number" min="0" value="0">
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <div style="display:flex; gap:8px;">
                    <select name="category_id" id="categorySelect" style="flex:1; padding:12px 16px; border:2px solid #e2e8f0; border-radius:10px; font-size:1em; outline:none; transition:border-color .2s;">
                        <option value="">Cargando categorías...</option>
                    </select>
                    <button type="button" onclick="nuevaCategoria()" class="btn btn-secondary" title="Nueva categoría" style="padding:12px 16px;">➕</button>
                </div>
            </div>
            <div class="form-group full checkbox-group">
                <input name="has_inventory" type="checkbox" id="hasInventory" checked>
                <label for="hasInventory" style="margin:0; cursor:pointer;">Este producto maneja inventario</label>
            </div>
            <div class="form-group full">
                <label>Imagen</label>
                <div class="image-upload">
                    <div id="previewContainer">
                        <div class="image-placeholder" id="placeholder">📷</div>
                    </div>
                    <input type="file" name="image" id="imageInput" accept="image/png,image/jpeg,image/jpg" class="file-input">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="/inventario" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">💾 Guardar</button>
        </div>
    </form>
</div>

<script>
const BASE_URL = window.location.origin;
let token = null;
let productoId = null;

// ========== UTILIDADES ==========
function getToken() {
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    if (urlToken) { localStorage.setItem('token', urlToken); return urlToken; }
    return localStorage.getItem('token');
}

function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }

function toast(msg, tipo = 'success') {
    const t = document.createElement('div');
    t.className = `toast toast-${tipo}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Error ${res.status}`);
    }
    return res.json();
}

// ========== PERFIL ==========
async function cargarPerfil() {
    token = getToken();
    if (!token) { window.location.href = '/login'; return false; }
    try {
        const user = await apiFetch(`${BASE_URL}/users/me`);
        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('userRole').textContent = ({
            'ADMIN':'👑 Admin','WAREHOUSE_MANAGER':'📦 Almacén','CASHIER':'💰 Cajero'
        })[(user.role || '').toUpperCase()] || user.role;
        return true;
    } catch { return false; }
}

// ========== DETECTAR ID (modo edición) ==========
function detectarId() {
    const match = window.location.pathname.match(/\/inventario\/(\d+)\/editar/);
    if (match) productoId = match[1];
}

// ========== CATEGORÍAS ==========
async function cargarCategorias() {
    const sel = document.getElementById('categorySelect');
    try {
        const cats = await apiFetch(`${BASE_URL}/categories/`);
        if (!cats.length) {
            sel.innerHTML = '<option value="">— No hay categorías (creá una con ➕) —</option>';
            return;
        }
        sel.innerHTML = '<option value="">— Sin categoría —</option>' +
            cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    } catch (e) {
        sel.innerHTML = '<option value="">⚠️ Error al cargar categorías</option>';
        console.warn('Error categorías:', e.message);
    }
}

async function nuevaCategoria() {
    const nombre = prompt('Nombre de la nueva categoría:');
    if (!nombre || !nombre.trim()) return;
    const descripcion = prompt('Descripción (opcional):') || null;
    try {
        const nueva = await apiFetch(`${BASE_URL}/categories/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nombre.trim(), description: descripcion })
        });
        await cargarCategorias();
        document.getElementById('categorySelect').value = nueva.id;
        toast('Categoría creada');
    } catch (e) {
        toast(e.message, 'error');
    }
}

// ========== CARGAR PRODUCTO (modo edición) ==========
async function cargarProducto() {
    try {
        const p = await apiFetch(`${BASE_URL}/warehouse/products/${productoId}`);
        document.getElementById('pageTitle').textContent = 'Editar Producto';
        const f = document.getElementById('form');
        f.sku.value = p.sku || '';
        f.name.value = p.name || '';
        f.description.value = p.description || '';
        f.price.value = p.price ?? '';
        f.cost.value = p.cost ?? '';
        f.min_stock.value = p.min_stock ?? 0;
        f.category_id.value = p.category_id ?? '';
        f.has_inventory.checked = !!p.has_inventory;

        if (p.image_url) {
            document.getElementById('previewContainer').innerHTML =
                `<img src="${p.image_url}" class="image-preview has-image" id="preview">`;
        }
    } catch (e) {
        toast(e.message, 'error');
    }
}

// ========== PREVIEW DE IMAGEN ==========
document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        document.getElementById('previewContainer').innerHTML =
            `<img src="${ev.target.result}" class="image-preview has-image" id="preview">`;
    };
    reader.readAsDataURL(file);
});

// ========== SUBMIT DEL FORMULARIO ==========
document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
        const fd = new FormData();
        fd.append('sku', form.sku.value.trim());
        fd.append('name', form.name.value.trim());
        if (form.description.value.trim()) fd.append('description', form.description.value.trim());
        fd.append('price', form.price.value);
        if (form.cost.value) fd.append('cost', form.cost.value);
        fd.append('min_stock', form.min_stock.value || 0);
        if (form.category_id.value) fd.append('category_id', form.category_id.value);
        fd.append('has_inventory', form.has_inventory.checked ? 'true' : 'false');

        const img = document.getElementById('imageInput').files[0];
        if (img) fd.append('image', img);

        const url = productoId
            ? `${BASE_URL}/warehouse/products/${productoId}`
            : `${BASE_URL}/warehouse/products`;
        const method = productoId ? 'PUT' : 'POST';

        await apiFetch(url, { method, body: fd });
        toast(productoId ? 'Producto actualizado' : 'Producto creado');
        setTimeout(() => window.location.href = '/inventario', 800);
    } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = '💾 Guardar';
    }
});

// ========== INICIALIZACIÓN ==========
(async () => {
    detectarId();
    const ok = await cargarPerfil();
    if (!ok) return;
    await cargarCategorias();              // 1) categorías primero
    if (productoId) await cargarProducto(); // 2) después el producto (si es edición)
})();
</script>
</body>
</html>
