<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Stock - MiPOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:18px 40px; color:white;
    display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 20px rgba(0,0,0,.1);
    flex-wrap:wrap; gap:15px; }
.navbar-left { display:flex; align-items:center; gap:20px; }
.logo { font-size:1.4em; font-weight:800; }
.nav-links { display:flex; gap:12px; flex-wrap:wrap; }
.nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:.9em; }
.nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.2); }
.user-info { display:flex; align-items:center; gap:15px; font-size:.95em; }
.user-role { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:.85em; font-weight:700; }
.logout-btn { background:rgba(255,255,255,.2); color:white; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; }

.container { padding:30px 40px 60px; }
.page-header { margin-bottom:20px; }
.page-header h1 { color:#2d3748; font-size:1.8em; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:25px; }
.stat-card { background:white; padding:20px; border-radius:15px; box-shadow:0 2px 15px rgba(0,0,0,.05);
    border-left:5px solid #667eea; }
.stat-card.warning { border-left-color:#ed8936; }
.stat-card.danger { border-left-color:#f56565; }
.stat-value { font-size:2em; font-weight:800; color:#2d3748; }
.stat-label { color:#718096; font-size:.9em; margin-top:4px; }

.toolbar { display:flex; gap:15px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.checkbox-label { display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; color:#4a5568; }
.checkbox-label input { width:18px; height:18px; cursor:pointer; }

.table-container { background:white; border-radius:15px; overflow:hidden; box-shadow:0 2px 15px rgba(0,0,0,.05); }
table { width:100%; border-collapse:collapse; }
th { background:#f7fafc; padding:14px 16px; text-align:left; font-weight:700; color:#2d3748;
    font-size:.85em; text-transform:uppercase; letter-spacing:.5px; }
td { padding:14px 16px; border-top:1px solid #edf2f7; color:#4a5568; vertical-align:middle; }
tr:hover td { background:#f7fafc; }
.low-stock-row td { background:#fff5f5; }
.low-stock-row:hover td { background:#fed7d7; }

.badge { padding:4px 10px; border-radius:10px; font-size:.75em; font-weight:700; display:inline-block; }
.badge-ok { background:#c6f6d5; color:#22543d; }
.badge-warn { background:#feebc8; color:#7b341e; }
.badge-danger { background:#fed7d7; color:#742a2a; }

.loading { text-align:center; padding:60px; color:#718096; }
.spinner { border:3px solid #f3f3f3; border-top:3px solid #667eea; border-radius:50%;
    width:40px; height:40px; animation:spin 1s linear infinite; margin:0 auto 15px; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:10px;
    color:white; font-weight:600; z-index:9999; box-shadow:0 5px 20px rgba(0,0,0,.2); }
.toast-success { background:#48bb78; }
.toast-error { background:#f56565; }

@media (max-width:768px) { .navbar { padding:15px 20px; } .container { padding:20px; } table { font-size:.85em; } th, td { padding:8px; } }
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <div class="logo">🛒 MiPOS</div>
        <div class="nav-links">
            <a href="/panel">🏠 Inicio</a>
            <a href="/inventario">📦 Productos</a>
            <a href="/inventario/entradas">📥 Entradas</a>
            <a href="/inventario/stock" class="active">📊 Stock</a>
            <a href="/inventario/stock/consolidado">📈 Consolidado</a>
            <a href="/proveedores">🏢 Proveedores</a>
            <a href="/pos/locations">🏪 Puntos de Venta</a>
            <a href="/transferencias">🔄 Transferencias</a>
        </div>
    </div>
    <div class="user-info">
        <span>👤 <span id="userName">...</span></span>
        <span class="user-role" id="userRole">—</span>
        <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>📊 Stock del Almacén</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-label">Productos en inventario</div>
        </div>
        <div class="stat-card warning">
            <div class="stat-value" id="statLow">—</div>
            <div class="stat-label">Productos con bajo stock</div>
        </div>
    </div>

    <div class="toolbar">
        <label class="checkbox-label">
            <input type="checkbox" id="soloBajo" onchange="cargarStock()">
            Mostrar solo productos con bajo stock
        </label>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Cargando stock...</p>
    </div>

    <div id="tableContainer" class="table-container" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Stock mínimo</th>
                    <th>Estado</th>
                    <th>Última actualización</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
const BASE_URL = window.location.origin;
let token = null;

function getToken() {
    const p = new URLSearchParams(window.location.search);
    const t = p.get('token');
    if (t) { localStorage.setItem('token', t); return t; }
    return localStorage.getItem('token');
}
function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }
function toast(msg, tipo='success') {
    const t = document.createElement('div');
    t.className = `toast toast-${tipo}`; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fecha(s) { return s ? new Date(s).toLocaleString('es-ES', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }

async function apiFetch(url, options={}) {
    const headers = options.headers || {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || `Error ${res.status}`); }
    return res.json();
}

async function cargarPerfil() {
    token = getToken();
    if (!token) { window.location.href = '/login'; return false; }
    try {
        const user = await apiFetch(`${BASE_URL}/users/me`);
        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('userRole').textContent = ({
            'ADMIN':'👑 Admin','WAREHOUSE_MANAGER':'📦 Almacén','CASHIER':'💰 Cajero'
        })[(user.role||'').toUpperCase()] || user.role;
        return true;
    } catch { return false; }
}

async function cargarStock() {
    const soloBajo = document.getElementById('soloBajo').checked;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tableContainer').style.display = 'none';

    try {
        const url = soloBajo
            ? `${BASE_URL}/warehouse/low-stock`
            : `${BASE_URL}/warehouse/stock`;
        const stock = await apiFetch(url);

        document.getElementById('loading').style.display = 'none';

        const totales = soloBajo ? null : stock.length;
        const bajos = stock.filter(s => s.quantity <= s.min_stock).length;

        if (!soloBajo) document.getElementById('statTotal').textContent = totales;
        document.getElementById('statLow').textContent = bajos;

        if (!stock.length) {
            document.getElementById('tbody').innerHTML =
                '<tr><td colspan="6" style="text-align:center;padding:40px;color:#a0aec0;">No hay productos</td></tr>';
            document.getElementById('tableContainer').style.display = 'block';
            return;
        }

        document.getElementById('tbody').innerHTML = stock.map(s => {
            const esBajo = s.quantity <= s.min_stock;
            const esCero = s.quantity === 0;
            const badge = esCero ? 'badge-danger' : (esBajo ? 'badge-warn' : 'badge-ok');
            const estado = esCero ? 'SIN STOCK' : (esBajo ? 'BAJO' : 'OK');
            return `
                <tr class="${esBajo ? 'low-stock-row' : ''}">
                    <td><strong>${escapeHtml(s.product?.sku || '—')}</strong></td>
                    <td>${escapeHtml(s.product?.name || '—')}</td>
                    <td><strong style="font-size:1.1em;">${s.quantity}</strong></td>
                    <td>${s.min_stock}</td>
                    <td><span class="badge ${badge}">${estado}</span></td>
                    <td>${fecha(s.last_updated)}</td>
                </tr>
            `;
        }).join('');

        document.getElementById('tableContainer').style.display = 'block';
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        toast(e.message, 'error');
    }
}

(async () => {
    const ok = await cargarPerfil();
    if (ok) cargarStock();
})();
</script>
</body>
</html>
