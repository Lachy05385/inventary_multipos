<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedor - MiPOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:18px 40px; color:white;
    display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 20px rgba(0,0,0,.1);
    flex-wrap:wrap; gap:15px; }
.navbar-left { display:flex; align-items:center; gap:20px; }
.logo { font-size:1.4em; font-weight:800; }
.nav-links { display:flex; gap:12px; flex-wrap:wrap; }
.nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:.9em; }
.nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.2); }
.user-info { display:flex; align-items:center; gap:15px; font-size:.95em; }
.user-role { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:.85em; font-weight:700; }
.logout-btn { background:rgba(255,255,255,.2); color:white; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; }

.container { max-width:800px; margin:0 auto; padding:30px 40px 60px; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.page-header h1 { color:#2d3748; font-size:1.8em; }
.btn { padding:12px 24px; border:none; border-radius:10px; font-weight:700; cursor:pointer;
    text-decoration:none; font-size:.95em; display:inline-flex; align-items:center; gap:8px; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(102,126,234,.4); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-secondary { background:#e2e8f0; color:#4a5568; }

.form-card { background:white; border-radius:15px; padding:35px; box-shadow:0 2px 15px rgba(0,0,0,.05); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.form-group { display:flex; flex-direction:column; gap:8px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-weight:700; color:#2d3748; font-size:.9em; }
.form-group label .req { color:#f56565; }
.form-group input, .form-group select, .form-group textarea {
    padding:12px 16px; border:2px solid #e2e8f0; border-radius:10px;
    font-size:1em; font-family:inherit; outline:none; transition:border-color .2s;
    background:white;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#667eea; }
.form-group textarea { resize:vertical; min-height:80px; }

.form-actions { display:flex; gap:12px; margin-top:30px; justify-content:flex-end; }

.toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:10px;
    color:white; font-weight:600; z-index:9999; box-shadow:0 5px 20px rgba(0,0,0,.2); }
.toast-success { background:#48bb78; }
.toast-error { background:#f56565; }

@media (max-width:768px) {
    .navbar { padding:15px 20px; }
    .container { padding:20px; }
    .form-grid { grid-template-columns:1fr; }
    .form-card { padding:20px; }
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <div class="logo">🛒 MiPOS</div>
        <div class="nav-links">
            <a href="/panel">🏠 Inicio</a>
            <a href="/inventario">📦 Productos</a>
            <a href="/inventario/entradas">📥 Entradas</a>
            <a href="/inventario/stock">📊 Stock</a>
            <a href="/transferencias">🔄 Transferencias</a>
            <a href="/proveedores" class="active">🏢 Proveedores</a>
        </div>
    </div>
    <div class="user-info">
        <span>👤 <span id="userName">...</span></span>
        <span class="user-role" id="userRole">—</span>
        <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 id="pageTitle">Nuevo Proveedor</h1>
        <a href="/proveedores" class="btn btn-secondary">← Volver</a>
    </div>

    <form id="form" class="form-card">
        <div class="form-grid">
            <div class="form-group">
                <label>Código <span class="req">*</span></label>
                <input name="code" required maxlength="50" placeholder="PROV-001">
            </div>
            <div class="form-group">
                <label>Nombre <span class="req">*</span></label>
                <input name="name" required maxlength="150">
            </div>
            <div class="form-group">
                <label>Tipo de documento</label>
                <select name="document_type">
                    <option value="">— Selecciona —</option>
                    <option value="invoice">Factura (Invoice)</option>
                    <option value="receipt">Recibo (Receipt)</option>
                    <option value="delivery_note">Nota de Entrega (Delivery Note)</option>
                    <option value="purchase_order">Orden de Compra (Purchase Order)</option>
                    <option value="contract">Contrato (Contract)</option>
                    <option value="other">Otro (Other)</option>
                </select>
            </div>
            <div class="form-group">
                <label>N° de contrato</label>
                <input name="contract_number" maxlength="100">
            </div>
            <div class="form-group">
                <label>Teléfono de contacto</label>
                <input name="contact_phone" maxlength="30">
            </div>
            <div class="form-group">
                <label>Email de contacto</label>
                <input name="contact_email" type="email" maxlength="150">
            </div>
            <div class="form-group full">
                <label>Dirección</label>
                <textarea name="address" rows="2"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <a href="/proveedores" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">💾 Guardar</button>
        </div>
    </form>
</div>

<script>
const BASE_URL = window.location.origin;
let token = null;
let proveedorId = null;

function getToken() {
    const p = new URLSearchParams(window.location.search);
    const t = p.get('token');
    if (t) { localStorage.setItem('token', t); return t; }
    return localStorage.getItem('token');
}

function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }

function toast(msg, tipo = 'success') {
    const t = document.createElement('div');
    t.className = `toast toast-${tipo}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Error ${res.status}`);
    }
    return res.json();
}

async function cargarPerfil() {
    token = getToken();
    if (!token) { window.location.href = '/login'; return false; }
    try {
        const user = await apiFetch(`${BASE_URL}/users/me`);
        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('userRole').textContent = ({
            'ADMIN':'👑 Admin','WAREHOUSE_MANAGER':'📦 Almacén','CASHIER':'💰 Cajero'
        })[(user.role || '').toUpperCase()] || user.role;
        return true;
    } catch { return false; }
}

function detectarId() {
    const match = window.location.pathname.match(/\/proveedores\/(\d+)\/editar/);
    if (match) proveedorId = match[1];
}

async function cargarProveedor() {
    try {
        const p = await apiFetch(`${BASE_URL}/suppliers/${proveedorId}`);
        document.getElementById('pageTitle').textContent = 'Editar Proveedor';
        const f = document.getElementById('form');
        f.code.value = p.code || '';
        f.name.value = p.name || '';
        f.document_type.value = p.document_type || '';
        f.contract_number.value = p.contract_number || '';
        f.contact_phone.value = p.contact_phone || '';
        f.contact_email.value = p.contact_email || '';
        f.address.value = p.address || '';
    } catch (e) {
        toast(e.message, 'error');
    }
}

document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const payload = {
        code: form.code.value.trim(),
        name: form.name.value.trim(),
        document_type: form.document_type.value || null,
        contract_number: form.contract_number.value.trim() || null,
        contact_phone: form.contact_phone.value.trim() || null,
        contact_email: form.contact_email.value.trim() || null,
        address: form.address.value.trim() || null
    };

    try {
        const url = proveedorId
            ? `${BASE_URL}/suppliers/${proveedorId}`
            : `${BASE_URL}/suppliers/`;
        const method = proveedorId ? 'PUT' : 'POST';

        await apiFetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        toast(proveedorId ? 'Proveedor actualizado' : 'Proveedor creado');
        setTimeout(() => window.location.href = '/proveedores', 800);
    } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = '💾 Guardar';
    }
});

(async () => {
    detectarId();
    const ok = await cargarPerfil();
    if (!ok) return;
    if (proveedorId) await cargarProveedor();
})();
</script>
</body>
</html>
