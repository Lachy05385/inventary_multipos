<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Cajas Registradoras - MiPOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/pos.css">
    <style>
        /* Estilos específicos para la vista de cajas */
        .cajas-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .caja-total-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px 28px;
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(102,126,234,.35);
        }

        .caja-total-card .label {
            font-size: .85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            opacity: .9;
            margin-bottom: 8px;
        }

        .caja-total-card .value {
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
        }

        .caja-total-card .sub {
            font-size: .85rem;
            opacity: .85;
            margin-top: 8px;
        }

        .cajas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .caja-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .caja-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .caja-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .caja-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
        }

        .caja-card-id {
            font-size: .7rem;
            font-weight: 700;
            color: var(--gray-400);
            background: var(--gray-100);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .caja-card-balance {
            font-size: 2rem;
            font-weight: 800;
            color: var(--success);
            line-height: 1;
        }

        .caja-card-balance.zero {
            color: var(--gray-400);
        }

        .caja-card-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: .75rem;
            color: var(--gray-600);
            padding-top: 12px;
            border-top: 1px solid var(--gray-100);
        }

        .caja-card-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: .5;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--gray-600);
        }

        @media (max-width: 768px) {
            .caja-total-card .value {
                font-size: 2rem;
            }
            .cajas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="topbar-container" class="topbar"></div>
            <div class="content">
                <!-- Resumen general -->
                <div class="cajas-summary" id="summarySection" style="display:none;">
                    <div class="caja-total-card">
                        <div class="label">Efectivo total en cajas</div>
                        <div class="value" id="totalCash">$0.00</div>
                        <div class="sub"><span id="totalRegisters">0</span> cajas registradoras</div>
                    </div>
                </div>

                <!-- Lista de cajas -->
                <div id="loading" class="empty-state" style="display:none;">
                    <div class="icon">⏳</div>
                    <h3>Cargando cajas...</h3>
                </div>

                <div id="cajasGrid" class="cajas-grid" style="display:none;"></div>

                <div id="emptyState" class="empty-state" style="display:none;">
                    <div class="icon">💰</div>
                    <h3>No hay cajas registradoras</h3>
                    <p style="font-size:.9rem; margin-top:8px;">Las cajas se crean automáticamente al crear un punto de venta.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/sidebar.js"></script>
    <script>
        (async () => {
            const user = await initLayout('💰 Cajas Registradoras', 'Efectivo acumulado por punto de venta');
            if (!user) return;

            const rol = (user.role || '').toUpperCase();
            if (rol !== 'ADMIN' && rol !== 'WAREHOUSE_MANAGER') {
                showToast('Solo administradores y gerentes de almacén pueden ver esta página', 'error');
                setTimeout(() => window.location.href = '/panel', 1500);
                return;
            }

            await cargarCajas();
        })();

        async function cargarCajas() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('cajasGrid');
            const empty = document.getElementById('emptyState');
            const summary = document.getElementById('summarySection');

            loading.style.display = 'block';
            grid.style.display = 'none';
            empty.style.display = 'none';
            summary.style.display = 'none';

            try {
                const data = await apiFetch('/cash/registers/summary');
                loading.style.display = 'none';

                if (!data.registers || !data.registers.length) {
                    empty.style.display = 'block';
                    return;
                }

                // Mostrar resumen
                document.getElementById('totalCash').textContent = `$${data.total_cash.toFixed(2)}`;
                document.getElementById('totalRegisters').textContent = data.registers_count;
                summary.style.display = 'grid';

                // Renderizar tarjetas
                grid.innerHTML = data.registers.map(r => {
                    const balance = r.current_balance || 0;
                    const isZero = balance === 0;
                    const fecha = r.last_updated
                        ? new Date(r.last_updated).toLocaleString('es-ES', {
                            year: 'numeric', month: 'short', day: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        })
                        : '—';

                    return `
                        <div class="caja-card">
                            <div class="caja-card-header">
                                <div class="caja-card-title">🏪 ${escapeHtml(r.pos_name)}</div>
                                <div class="caja-card-id">#${r.id}</div>
                            </div>
                            <div class="caja-card-balance ${isZero ? 'zero' : ''}">
                                $${balance.toFixed(2)}
                            </div>
                            <div class="caja-card-meta">
                                <span>🆔 POS ID: ${r.pos_location_id}</span>
                                <span>🕒 Actualizado: ${fecha}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                grid.style.display = 'grid';
            } catch (e) {
                loading.style.display = 'none';
                showToast(e.message, 'error');
                empty.style.display = 'block';
            }
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }
    </script>
</body>
</html>
