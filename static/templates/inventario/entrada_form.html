<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva Entrada - MiPOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f2f5; min-height:100vh; }
.navbar { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:18px 40px; color:white;
    display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 20px rgba(0,0,0,.1);
    flex-wrap:wrap; gap:15px; }
.navbar-left { display:flex; align-items:center; gap:20px; }
.logo { font-size:1.4em; font-weight:800; }
.nav-links { display:flex; gap:15px; }
.nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:8px; font-weight:600; font-size:.9em; }
.nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.2); }
.user-info { display:flex; align-items:center; gap:15px; font-size:.95em; }
.user-role { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:.85em; font-weight:700; }
.logout-btn { background:rgba(255,255,255,.2); color:white; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:600; }

.container { max-width:1100px; margin:0 auto; padding:30px 40px 60px; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.page-header h1 { color:#2d3748; font-size:1.8em; }
.btn { padding:12px 24px; border:none; border-radius:10px; font-weight:700; cursor:pointer;
    text-decoration:none; font-size:.95em; display:inline-flex; align-items:center; gap:8px; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(102,126,234,.4); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-secondary { background:#e2e8f0; color:#4a5568; }
.btn-secondary:hover { background:#cbd5e0; }
.btn-sm { padding:6px 14px; font-size:.85em; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
.btn-danger { background:#f56565; color:white; }

.section-card { background:white; border-radius:15px; padding:25px; box-shadow:0 2px 15px rgba(0,0,0,.05); margin-bottom:20px; }
.section-card h3 { color:#2d3748; margin-bottom:20px; font-size:1.1em; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.form-group { display:flex; flex-direction:column; gap:8px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-weight:700; color:#2d3748; font-size:.9em; }
.form-group input, .form-group select, .form-group textarea {
    padding:11px 14px; border:2px solid #e2e8f0; border-radius:10px;
    font-size:.95em; font-family:inherit; outline:none; transition:border-color .2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#667eea; }

.items-table { width:100%; border-collapse:collapse; margin-bottom:15px; }
.items-table th { background:#f7fafc; padding:10px; text-align:left; font-size:.8em;
    text-transform:uppercase; color:#4a5568; font-weight:700; }
.items-table td { padding:8px; border-top:1px solid #edf2f7; vertical-align:middle; }
.items-table input, .items-table select {
    width:100%; padding:8px 10px; border:2px solid #e2e8f0; border-radius:8px;
    font-size:.9em; outline:none;
}
.items-table input:focus, .items-table select:focus { border-color:#667eea; }
.subtotal-cell { font-weight:700; color:#2d3748; padding:8px 10px; white-space:nowrap; }

.totals { display:flex; justify-content:flex-end; gap:30px; padding-top:20px; border-top:2px solid #edf2f7; margin-top:15px; }
.totals .total-item { display:flex; flex-direction:column; align-items:flex-end; }
.totals .label { font-size:.8em; color:#718096; text-transform:uppercase; font-weight:700; }
.totals .value { font-size:1.4em; font-weight:800; color:#2d3748; }

.form-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:20px; }

.toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:10px;
    color:white; font-weight:600; z-index:9999; box-shadow:0 5px 20px rgba(0,0,0,.2); }
.toast-success { background:#48bb78; }
.toast-error { background:#f56565; }

@media (max-width:768px) {
    .navbar { padding:15px 20px; }
    .container { padding:20px; }
    .form-grid { grid-template-columns:1fr; }
    .items-table { font-size:.85em; }
    .items-table th, .items-table td { padding:6px 4px; }
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <div class="logo">🛒 MiPOS</div>
        <div class="nav-links">
            <a href="/panel">🏠 Inicio</a>
            <a href="/inventario">📦 Productos</a>
            <a href="/inventario/entradas" class="active">📥 Entradas</a>
            <a href="/inventario/stock">📊 Stock</a>
            <a href="/transferencias">🔄 Transferencias</a>
        </div>
    </div>
    <div class="user-info">
        <span>👤 <span id="userName">...</span></span>
        <span class="user-role" id="userRole">—</span>
        <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>📥 Nueva Entrada de Compra</h1>
        <a href="/inventario/entradas" class="btn btn-secondary">← Volver</a>
    </div>

    <form id="form">
        <div class="section-card">
            <h3>Datos de la compra</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Proveedor *</label>
                    <select name="supplier_id" required id="supplierSelect">
                        <option value="">Cargando proveedores...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>N° Documento</label>
                    <input name="document_number" maxlength="50" placeholder="Factura, recibo, etc.">
                </div>
                <div class="form-group">
                    <label>Fecha del documento</label>
                    <input name="document_date" type="date">
                </div>
                <div class="form-group">
                    <label>Monto pagado</label>
                    <input name="paid_amount" type="number" step="0.01" min="0" value="0">
                </div>
                <div class="form-group full">
                    <label>Notas</label>
                    <textarea name="notes" rows="2" placeholder="Observaciones opcionales..."></textarea>
                </div>
            </div>
        </div>

        <div class="section-card">
            <h3>Productos</h3>
            <table class="items-table">
                <thead>
                    <tr>
                        <th style="width:40%;">Producto</th>
                        <th style="width:12%;">Cantidad</th>
                        <th style="width:18%;">Precio Unit.</th>
                        <th style="width:15%;">Descuento</th>
                        <th style="width:15%;">Subtotal</th>
                        <th style="width:5%;"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
            </table>
            <button type="button" class="btn btn-secondary" onclick="agregarItem()">➕ Agregar Producto</button>

            <div class="totals">
                <div class="total-item">
                    <span class="label">Total</span>
                    <span class="value" id="totalValue">$0.00</span>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="/inventario/entradas" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">💾 Registrar Entrada</button>
        </div>
    </form>
</div>

<script>
const BASE_URL = window.location.origin;
let token = null;
let productos = [];
let proveedores = [];

function getToken() {
    const p = new URLSearchParams(window.location.search);
    const t = p.get('token');
    if (t) { localStorage.setItem('token', t); return t; }
    return localStorage.getItem('token');
}

function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }

function toast(msg, tipo='success') {
    const t = document.createElement('div');
    t.className = `toast toast-${tipo}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

async function apiFetch(url, options={}) {
    const headers = options.headers || {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) {
        const e = await res.json().catch(()=>({}));
        throw new Error(e.detail || `Error ${res.status}`);
    }
    return res.json();
}

async function cargarPerfil() {
    token = getToken();
    if (!token) { window.location.href = '/login'; return false; }
    try {
        const user = await apiFetch(`${BASE_URL}/users/me`);
        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('userRole').textContent = ({
            'ADMIN':'👑 Admin','WAREHOUSE_MANAGER':'📦 Almacén','CASHIER':'💰 Cajero'
        })[(user.role||'').toUpperCase()] || user.role;
        return true;
    } catch { return false; }
}

async function cargarProductos() {
    try {
        productos = await apiFetch(`${BASE_URL}/warehouse/products?limit=500`);
    } catch (e) {
        toast('Error al cargar productos: ' + e.message, 'error');
        productos = [];
    }
}

async function cargarProveedores() {
    const select = document.getElementById('supplierSelect');
    try {
        proveedores = await apiFetch(`${BASE_URL}/suppliers/`);
        if (!proveedores.length) {
            select.innerHTML = '<option value="">No hay proveedores — creá uno primero</option>';
            return;
        }
        select.innerHTML = '<option value="">— Selecciona proveedor —</option>' +
            proveedores.map(s =>
                `<option value="${s.id}">${escapeHtml(s.code)} - ${escapeHtml(s.name)}</option>`
            ).join('');
    } catch (e) {
        select.innerHTML = '<option value="">⚠️ Error al cargar proveedores</option>';
        console.warn('No se pudo cargar proveedores:', e.message);
    }
}

function nuevoItemHTML() {
    const opts = productos
        .filter(p => p.has_inventory)
        .map(p => `<option value="${p.id}" data-price="${p.cost || 0}">${escapeHtml(p.sku)} - ${escapeHtml(p.name)}</option>`)
        .join('');

    const id = 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);

    const tr = document.createElement('tr');
    tr.id = id;
    tr.innerHTML = `
        <td>
            <select class="item-product" required onchange="onProductChange(this)">
                <option value="">— Selecciona —</option>
                ${opts}
            </select>
        </td>
        <td><input class="item-qty" type="number" min="1" value="1" required oninput="recalcular()"></td>
        <td><input class="item-price" type="number" step="0.01" min="0" value="0" required oninput="recalcular()"></td>
        <td><input class="item-discount" type="number" step="0.01" min="0" value="0" oninput="recalcular()"></td>
        <td class="subtotal-cell">$0.00</td>
        <td><button type="button" class="btn-sm btn-danger" onclick="this.closest('tr').remove(); recalcular()">✕</button></td>
    `;
    return tr;
}

function agregarItem() {
    if (!productos.filter(p => p.has_inventory).length) {
        toast('No hay productos con inventario para agregar', 'error');
        return;
    }
    document.getElementById('itemsBody').appendChild(nuevoItemHTML());
}

function onProductChange(select) {
    const opt = select.selectedOptions[0];
    if (opt && opt.dataset.price) {
        const tr = select.closest('tr');
        tr.querySelector('.item-price').value = opt.dataset.price;
    }
    recalcular();
}

function recalcular() {
    let total = 0;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
        const qty = parseFloat(tr.querySelector('.item-qty').value) || 0;
        const price = parseFloat(tr.querySelector('.item-price').value) || 0;
        const disc = parseFloat(tr.querySelector('.item-discount').value) || 0;
        const sub = Math.max(0, qty * price - disc);
        tr.querySelector('.subtotal-cell').textContent = '$' + sub.toFixed(2);
        total += sub;
    });
    document.getElementById('totalValue').textContent = '$' + total.toFixed(2);
}

document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');

    const items = [];
    let valido = true;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
        const pid = tr.querySelector('.item-product').value;
        const qty = parseInt(tr.querySelector('.item-qty').value) || 0;
        const price = parseFloat(tr.querySelector('.item-price').value) || 0;
        const disc = parseFloat(tr.querySelector('.item-discount').value) || 0;
        if (!pid || qty <= 0) { valido = false; return; }
        items.push({
            product_id: parseInt(pid),
            quantity: qty,
            unit_price: price,
            discount: disc
        });
    });

    if (!valido || !items.length) {
        toast('Completa todos los productos correctamente', 'error');
        return;
    }

    const form = e.target;
    if (!form.supplier_id.value) {
        toast('Selecciona un proveedor', 'error');
        return;
    }

    const payload = {
        supplier_id: parseInt(form.supplier_id.value),
        document_number: form.document_number.value.trim() || null,
        document_date: form.document_date.value || null,
        paid_amount: parseFloat(form.paid_amount.value) || 0,
        notes: form.notes.value.trim() || null,
        items: items
    };

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    try {
        await apiFetch(`${BASE_URL}/warehouse/purchase-entries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        toast('Entrada registrada correctamente');
        setTimeout(() => window.location.href = '/inventario/entradas', 800);
    } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = '💾 Registrar Entrada';
    }
});

(async () => {
    const ok = await cargarPerfil();
    if (!ok) return;
    await Promise.all([cargarProductos(), cargarProveedores()]);
    agregarItem();
})();
</script>
</body>
</html>
