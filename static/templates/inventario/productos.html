<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 Productos - MiPOS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0f2f5; min-height:100vh; }

.navbar { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:18px 40px; color:white;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 4px 20px rgba(0,0,0,.1); flex-wrap:wrap; gap:15px; }
.navbar-left { display:flex; align-items:center; gap:20px; }
.logo { font-size:1.4em; font-weight:800; }
.nav-links { display:flex; gap:15px; }
.nav-links a { color:white; text-decoration:none; padding:6px 12px; border-radius:8px;
    font-weight:600; font-size:.9em; transition:background .2s; }
.nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,.2); }
.user-info { display:flex; align-items:center; gap:15px; font-size:.95em; }
.user-role { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:.85em; font-weight:700; }
.logout-btn { background:rgba(255,255,255,.2); color:white; border:none; padding:8px 18px;
    border-radius:8px; cursor:pointer; font-weight:600; }
.logout-btn:hover { background:rgba(255,255,255,.3); }

.container { padding:30px 40px 60px; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px; }
.page-header h1 { color:#2d3748; font-size:1.8em; }
.btn { padding:12px 24px; border:none; border-radius:10px; font-weight:700;
    cursor:pointer; text-decoration:none; font-size:.95em; transition:all .2s; display:inline-flex; align-items:center; gap:8px; }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(102,126,234,.4); }
.btn-secondary { background:#e2e8f0; color:#4a5568; }
.btn-secondary:hover { background:#cbd5e0; }
.btn-sm { padding:6px 14px; font-size:.85em; border-radius:8px; border:none; cursor:pointer; font-weight:600; text-decoration:none; display:inline-block; }
.btn-edit { background:#4299e1; color:white; }
.btn-delete { background:#f56565; color:white; }

.toolbar { margin-bottom:20px; }
.toolbar input { width:100%; max-width:420px; padding:12px 16px; border:2px solid #e2e8f0;
    border-radius:10px; font-size:1em; outline:none; transition:border-color .2s; }
.toolbar input:focus { border-color:#667eea; }

.table-container { background:white; border-radius:15px; overflow:hidden; box-shadow:0 2px 15px rgba(0,0,0,.05); }
table { width:100%; border-collapse:collapse; }
th { background:#f7fafc; padding:14px 16px; text-align:left; font-weight:700; color:#2d3748; font-size:.9em; text-transform:uppercase; letter-spacing:.5px; }
td { padding:12px 16px; border-top:1px solid #edf2f7; color:#4a5568; vertical-align:middle; }
tr:hover td { background:#f7fafc; }
.product-img { width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid #e2e8f0; }
.img-placeholder { width:48px; height:48px; background:#edf2f7; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.2em; }
.badge { display:inline-block; padding:4px 10px; border-radius:10px; font-size:.75em; font-weight:700; }
.badge-yes { background:#c6f6d5; color:#22543d; }
.badge-no { background:#e2e8f0; color:#4a5568; }
.actions { display:flex; gap:6px; }

.empty-state { text-align:center; padding:60px 20px; color:#a0aec0; }
.empty-state .icon { font-size:4em; margin-bottom:15px; }

.loading { text-align:center; padding:60px; color:#718096; }
.spinner { border:3px solid #f3f3f3; border-top:3px solid #667eea; border-radius:50%;
    width:40px; height:40px; animation:spin 1s linear infinite; margin:0 auto 15px; }
@keyframes spin { to { transform:rotate(360deg); } }

.toast { position:fixed; top:20px; right:20px; padding:14px 24px; border-radius:10px;
    color:white; font-weight:600; z-index:9999; box-shadow:0 5px 20px rgba(0,0,0,.2);
    animation:slideIn .3s ease; }
.toast-success { background:#48bb78; }
.toast-error { background:#f56565; }
@keyframes slideIn { from { transform:translateX(400px); } to { transform:translateX(0); } }

@media (max-width:768px) {
    .navbar { padding:15px 20px; }
    .container { padding:20px; }
    .page-header h1 { font-size:1.4em; }
    table { font-size:.85em; }
    th, td { padding:8px; }
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <div class="logo">🛒 MiPOS</div>
        <div class="nav-links">
            <a href="/panel">🏠 Inicio</a>
            <a href="/inventario" class="active">📦 Productos</a>
            <a href="/inventario/entradas">📥 Entradas</a>
            <a href="/inventario/stock">📊 Stock</a>
            <a href="/transferencias">🔄 Transferencias</a>
        </div>
    </div>
    <div class="user-info">
        <span>👤 <span id="userName">...</span></span>
        <span class="user-role" id="userRole">—</span>
        <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>📦 Productos</h1>
        <a href="/inventario/nuevo" class="btn btn-primary">➕ Nuevo Producto</a>
    </div>

    <div class="toolbar">
        <input type="text" id="search" placeholder="🔍 Buscar por nombre o SKU..." oninput="debounceSearch()">
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Cargando productos...</p>
    </div>

    <div id="tableContainer" class="table-container" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>SKU</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Costo</th>
                    <th>Inventario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="icon">📦</div>
        <p>No hay productos registrados</p>
        <br>
        <a href="/inventario/nuevo" class="btn btn-primary">Crear el primero</a>
    </div>
</div>

<script>
const BASE_URL = window.location.origin;
let token = null;

function getToken() {
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    if (urlToken) { localStorage.setItem('token', urlToken); return urlToken; }
    return localStorage.getItem('token');
}

function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }

function toast(msg, tipo = 'success') {
    const t = document.createElement('div');
    t.className = `toast toast-${tipo}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

function money(n) {
    return '$' + Number(n || 0).toFixed(2);
}

async function apiFetch(url, options = {}) {
    const headers = options.headers || {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Error ${res.status}`);
    }
    return res.json();
}

async function cargarPerfil() {
    token = getToken();
    if (!token) { window.location.href = '/login'; return false; }
    try {
        const user = await apiFetch(`${BASE_URL}/users/me`);
        document.getElementById('userName').textContent = user.full_name;
        document.getElementById('userRole').textContent = ({
            'ADMIN':'👑 Admin','WAREHOUSE_MANAGER':'📦 Almacén','CASHIER':'💰 Cajero'
        })[(user.role || '').toUpperCase()] || user.role;
        return true;
    } catch { return false; }
}

let searchTimer = null;
function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(cargarProductos, 300);
}

async function cargarProductos() {
    const search = document.getElementById('search').value.trim();
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tableContainer').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';

    try {
        const params = new URLSearchParams();
        if (search) params.set('search', search);

        const productos = await apiFetch(`${BASE_URL}/warehouse/products?${params}`);

        document.getElementById('loading').style.display = 'none';

        if (!productos.length) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }

        document.getElementById('tbody').innerHTML = productos.map(p => `
            <tr>
                <td>
                    ${p.image_url
                        ? `<img src="${p.image_url}" class="product-img" alt="${escapeHtml(p.name)}">`
                        : `<div class="img-placeholder">📦</div>`}
                </td>
                <td><strong>${escapeHtml(p.sku)}</strong></td>
                <td>${escapeHtml(p.name)}</td>
                <td><strong>${money(p.price)}</strong></td>
                <td>${p.cost ? money(p.cost) : '—'}</td>
                <td>
                    <span class="badge ${p.has_inventory ? 'badge-yes' : 'badge-no'}">
                        ${p.has_inventory ? 'Sí' : 'No'}
                    </span>
                </td>
                <td>
                    <div class="actions">
                        <a href="/inventario/${p.id}/editar" class="btn-sm btn-edit">✏️ Editar</a>
                        <button class="btn-sm btn-delete" onclick="eliminar(${p.id}, '${escapeHtml(p.name).replace(/'/g,"\\'")}')">🗑️</button>
                    </div>
                </td>
            </tr>
        `).join('');

        document.getElementById('tableContainer').style.display = 'block';
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        toast(e.message, 'error');
    }
}

async function eliminar(id, nombre) {
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;
    try {
        await apiFetch(`${BASE_URL}/warehouse/products/${id}`, { method: 'DELETE' });
        toast('Producto eliminado');
        cargarProductos();
    } catch (e) {
        toast(e.message, 'error');
    }
}

(async () => {
    const ok = await cargarPerfil();
    if (ok) cargarProductos();
})();
</script>
</body>
</html>
